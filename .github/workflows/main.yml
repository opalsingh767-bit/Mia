name: Build Mia APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts << 'MIA_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Mia"
          include(":app")
          MIA_EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts << 'MIA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          MIA_EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties << 'MIA_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          MIA_EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts << 'MIA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.mia"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mia"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          MIA_EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'MIA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="Mia"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MIA_EOF
          mkdir -p $(dirname app/src/main/java/com/example/mia/MainActivity.kt)
          cat > app/src/main/java/com/example/mia/MainActivity.kt << 'MIA_EOF'
          package com.example.mia

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.Locale

          const val MODEL = "claude-sonnet-5-5"
          val WAKE_WORDS = listOf("mia", "meya", "mea", "मिया", "मीया")
          const val SYSTEM_PROMPT =
              "Tum Mia ho, ek pyaari anime girl voice assistant. Hinglish ya Hindi mein " +
              "chhote (1-2 vaakya), meethe jawab do. Koi emoji ya markdown mat likhna."

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var status: TextView
              private lateinit var keyBox: EditText
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private val ui = Handler(Looper.getMainLooper())
              private val http = OkHttpClient()
              private val history = JSONArray()
              private var awaitingCommand = false
              private var busy = false
              private var apiKey = ""

              private fun hasMic() = ContextCompat.checkSelfPermission(
                  this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val prefs = getSharedPreferences("mia", 0)
                  apiKey = prefs.getString("key", "") ?: ""

                  keyBox = EditText(this).apply { hint = "Claude API key yahan paste karo"; setText(apiKey) }
                  val save = Button(this).apply {
                      text = "Save"
                      setOnClickListener {
                          apiKey = keyBox.text.toString().trim()
                          prefs.edit().putString("key", apiKey).apply()
                          status.text = "Key save ho gayi."
                          startListening()
                      }
                  }
                  status = TextView(this).apply { textSize = 22f; setPadding(0, 48, 0, 0) }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                      addView(keyBox); addView(save); addView(status)
                  })
                  status.text = if (apiKey.isEmpty()) "Pehle upar key daalo aur Save dabao." else "Mia shuru ho rahi hai..."

                  tts = TextToSpeech(this, this)
                  if (!hasMic()) ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 1)
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(c, p, r)
                  if (hasMic()) startListening() else status.text = "Mic permission chahiye."
              }

              override fun onInit(code: Int) {
                  tts?.language = Locale("hi", "IN")
                  tts?.setPitch(1.25f)
                  tts?.setSpeechRate(0.95f)
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onError(id: String?) { ui.post { startListening() } }
                      override fun onDone(id: String?) { ui.post { startListening() } }
                  })
                  ttsReady = true
                  startListening()
              }

              private fun speak(text: String) {
                  status.text = "Mia: $text"
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "mia")
              }

              private fun startListening() {
                  if (busy || apiKey.isEmpty() || !hasMic() || !ttsReady) return
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onResults(b: Bundle?) {
                              val text = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?.firstOrNull()?.lowercase(Locale.ROOT) ?: ""
                              handleSpeech(text)
                          }
                          override fun onError(e: Int) { ui.postDelayed({ startListening() }, 600) }
                          override fun onReadyForSpeech(p: Bundle?) {
                              status.text = if (awaitingCommand) "Haan, bolo..." else "Sun rahi hoon... ('Mia' bolo)"
                          }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(r: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(b: Bundle?) {}
                          override fun onEvent(t: Int, b: Bundle?) {}
                      })
                      startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      })
                  }
              }

              private fun handleSpeech(text: String) {
                  if (text.isBlank()) { startListening(); return }
                  if (awaitingCommand) { awaitingCommand = false; askClaude(text); return }
                  val wake = WAKE_WORDS.firstOrNull { text.contains(it) }
                  if (wake == null) { startListening(); return }
                  val command = text.substringAfter(wake).trim()
                  if (command.isEmpty()) { awaitingCommand = true; speak("Haan, bolo!") }
                  else askClaude(command)
              }

              private fun askClaude(userText: String) {
                  busy = true
                  status.text = "Soch rahi hoon..."
                  history.put(JSONObject().put("role", "user").put("content", userText))
                  while (history.length() > 10) history.remove(0)

                  val body = JSONObject()
                      .put("model", MODEL).put("max_tokens", 300)
                      .put("system", SYSTEM_PROMPT).put("messages", history)
                      .toString().toRequestBody("application/json".toMediaType())
                  val req = Request.Builder()
                      .url("https://api.anthropic.com/v1/messages")
                      .addHeader("x-api-key", apiKey)
                      .addHeader("anthropic-version", "2023-06-01")
                      .post(body).build()

                  http.newCall(req).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          ui.post { busy = false; speak("Internet mein dikkat hai.") }
                      }
                      override fun onResponse(call: Call, resp: Response) {
                          val raw = resp.body?.string() ?: ""
                          val reply = try {
                              JSONObject(raw).getJSONArray("content").getJSONObject(0).getString("text")
                          } catch (e: Exception) { null }
                          ui.post {
                              busy = false
                              if (reply == null) { history.remove(history.length() - 1); speak("Key ya API mein gadbad hai.") }
                              else {
                                  history.put(JSONObject().put("role", "assistant").put("content", reply))
                                  speak(reply)
                              }
                          }
                      }
                  })
              }

              override fun onDestroy() { recognizer?.destroy(); tts?.shutdown(); super.onDestroy() }
          }
          MIA_EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
